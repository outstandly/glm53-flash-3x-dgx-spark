# jspark3 pins the API to port 8000. If your tools already point at 8888 (MiaAI-Lab's default),
# run nginx:alpine with --network host on the head node and this file at /etc/nginx/conf.d/default.conf.
#
# Optional second block: a per-user key proxy on 8899 that maps friend keys -> the upstream and allows
# at most ONE concurrent request per key, so nobody's parallel agents queue in front of yours.
# Requires in an http-level conf (e.g. /etc/nginx/conf.d/access.conf):
#   map_hash_bucket_size 256;
#   limit_conn_zone $client_user zone=peruser:1m;

server {
    listen 8888;
    client_max_body_size 200m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

map $http_authorization $client_user {
    default "";
    "Bearer sk-spark-REPLACE-WITH-A-RANDOM-KEY" "friend1";
}

server {
    listen 8899;
    client_max_body_size 200m;
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location / {
        if ($client_user = "") { return 401 '{"error":"invalid api key"}'; }
        limit_conn peruser 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Client-User $client_user;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
